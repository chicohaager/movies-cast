<!doctype html>
<!-- The launcher icon for Android 6–7 (no adaptive icons there): both layers in a rounded square, as a PNG per density. -->
<html><head><meta charset="utf-8"><style>
html, body { margin: 0; width: 48px; height: 48px; overflow: hidden; background: transparent; }
.i { position: relative; width: 44px; height: 44px; margin: 2px; border-radius: 10px; overflow: hidden; }
.i img { position: absolute; left: -8px; top: -8px; width: 60px; height: 60px; }
</style></head><body><div class="i"><img src="icon-background.svg"><img src="icon-foreground.svg"></div></body></html>
