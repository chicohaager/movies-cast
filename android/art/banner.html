<!doctype html>
<!-- The Android TV banner (320×180 dp, launcher row). Rendered to res/drawable-*/banner.png by render.sh.
     Font: Space Grotesk (SIL OFL 1.1), the app's display font, res/font/space_grotesk.ttf. -->
<html><head><meta charset="utf-8"><style>
@font-face { font-family: SG; src: url("../app/src/main/res/font/space_grotesk.ttf"); font-weight: 300 700; }
html, body { margin: 0; width: 320px; height: 180px; overflow: hidden; }
.b { position: relative; width: 320px; height: 180px; overflow: hidden;
  background: radial-gradient(120% 140% at 30% 40%, #26262E 0%, #121216 45%, #050507 100%); }
.b::before { content: ""; position: absolute; inset: 0;
  background: radial-gradient(60% 80% at 92% 100%, rgba(245,158,11,.30), transparent 70%),
              radial-gradient(40% 60% at 6% 0%, rgba(229,231,235,.10), transparent 70%); }
.stars { position: absolute; inset: 0; }
.mark { position: absolute; left: -6px; top: 14px; width: 152px; height: 152px; }
.w { position: absolute; left: 140px; top: 52px; font-family: SG; color: #F5F5F4; line-height: .92; }
.w .m { font-weight: 700; font-size: 40px; letter-spacing: -.5px; }
.w .c { font-weight: 500; font-size: 40px; letter-spacing: 6px;
  background: linear-gradient(90deg, #FFF3C4, #F5C451 55%, #D4912A); -webkit-background-clip: text; color: transparent; }
</style></head><body><div class="b">
<svg class="stars" viewBox="0 0 320 180"><g fill="#fff">
<circle cx="150" cy="22" r="1" opacity=".8"/><circle cx="196" cy="14" r=".7" opacity=".5"/><circle cx="242" cy="30" r="1.2" opacity=".9"/>
<circle cx="290" cy="18" r=".7" opacity=".6"/><circle cx="304" cy="52" r="1" opacity=".7"/><circle cx="270" cy="150" r=".8" opacity=".6"/>
<circle cx="214" cy="160" r=".6" opacity=".5"/><circle cx="160" cy="152" r="1" opacity=".7"/><circle cx="20" cy="160" r=".8" opacity=".6"/>
<circle cx="110" cy="12" r=".6" opacity=".5"/><circle cx="12" cy="20" r=".9" opacity=".7"/></g></svg>
<img class="mark" src="icon-foreground.svg">
<div class="w"><div class="m">Movies</div><div class="c">CAST</div></div>
</div></body></html>
