<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Start page of the store build (package.sh STORE=1, roadmap 23): one app for
     everyone, so it asks for the address of Movies-Cast and keeps it, like the
     Android TV app. Unlike Android there is no shell that catches a load error,
     so the address is probed (/healthz) before the page is left. ES5 only: webOS
     4.x runs Chrome 53. -->
<style>
body { margin: 0; background: #0d0f14; color: #eef0f5; font: 2vw sans-serif; text-align: center; padding-top: 8vw; }
img { width: 9vw; height: 9vw; }
h1 { font-size: 3vw; margin: 1vw 0 2vw; }
input, button { font: inherit; padding: .8vw 1.4vw; border-radius: .8vw; border: .25vw solid #3a4150; background: #1d2232; color: #eef0f5; }
input { width: 34vw; }
input:focus, button:focus { border-color: #fb923c; outline: none; }
button { background: #fb923c; color: #111; border-color: #fb923c; margin-left: 1vw; }
.hint { color: #9aa0ad; font-size: 1.5vw; }
.err { color: #fdba74; }
</style>
</head>
<body>
<img src="largeIcon.png" alt="">
<h1>Movies-Cast</h1>
<p id="err" class="err" hidden></p>
<p id="ask"></p>
<form id="f"><input id="addr" autocomplete="off" spellcheck="false"><button id="go" type="submit"></button></form>
<p id="hint" class="hint"></p>
<script>
"use strict";
var L = (navigator.language || "en").toLowerCase().slice(0, 2);
var T = {
  en: { ask: "Address of Movies-Cast in your home network:", go: "Connect", hint: "For example 10.20.30.40 – the port 8097 is added.",
        fail: "Movies-Cast at {s} did not answer ({w}).", retry: "Trying again in 10 seconds – or correct the address.",
        conn: "no connection", time: "no answer", answer: "answer ", wait: "Connecting …" },
  de: { ask: "Adresse von Movies-Cast in deinem Heimnetz:", go: "Verbinden", hint: "Zum Beispiel 10.20.30.40 – der Port 8097 wird ergänzt.",
        fail: "Movies-Cast unter {s} hat nicht geantwortet ({w}).", retry: "Neuer Versuch in 10 Sekunden – oder die Adresse korrigieren.",
        conn: "keine Verbindung", time: "keine Antwort", answer: "Antwort ", wait: "Verbinde …" },
  fr: { ask: "Adresse de Movies-Cast dans votre réseau :", go: "Connecter", hint: "Par exemple 10.20.30.40 – le port 8097 est ajouté.",
        fail: "Movies-Cast à {s} n'a pas répondu ({w}).", retry: "Nouvel essai dans 10 secondes – ou corrigez l'adresse.",
        conn: "pas de connexion", time: "pas de réponse", answer: "réponse ", wait: "Connexion …" }
};
var t = T[L] || T.en;
function $(id) { return document.getElementById(id); }
var KEY = "moviescast.server";
function load() { try { return localStorage.getItem(KEY) || ""; } catch (e) { return ""; } }
function save(v) { try { localStorage.setItem(KEY, v); } catch (e) { /* asked again next start */ } }

// "10.20.30.40" -> "http://10.20.30.40:8097"; a scheme or port typed in stays.
function normalise(v) {
  v = v.replace(/^\s+|\s+$/g, "").replace(/\/+$/, "");
  if (!v) return "";
  if (!/^https?:\/\//i.test(v)) v = "http://" + v;
  if (!/^https?:\/\/(\[[^\]]+\]|[^\/:]+):\d+/i.test(v)) v = v.replace(/^(https?:\/\/(\[[^\]]+\]|[^\/:]+))/i, "$1:8097");
  return v;
}

var retry = null;
function failed(server, why) {
  $("err").hidden = false;
  $("err").textContent = t.fail.replace("{s}", server).replace("{w}", why);
  $("hint").textContent = t.retry;
  clearTimeout(retry);
  retry = setTimeout(function () { probe(server); }, 10000);
  $("addr").focus();
}

// probe asks /healthz and only then leaves this page for the TV page.
function probe(server) {
  $("hint").textContent = t.wait;
  var x = new XMLHttpRequest();
  x.open("GET", server + "/healthz", true);
  x.timeout = 5000;
  x.onload = function () {
    if (x.status === 200) { save(server); location.replace(server + "/tv/"); return; }
    failed(server, t.answer + x.status);
  };
  x.onerror = function () { failed(server, t.conn); };
  x.ontimeout = function () { failed(server, t.time); };
  x.send();
}

$("ask").textContent = t.ask;
$("go").textContent = t.go;
$("hint").textContent = t.hint;
var server = load();
$("addr").value = server ? server.replace(/^http:\/\//, "") : "";
$("f").addEventListener("submit", function (ev) {
  ev.preventDefault();
  clearTimeout(retry);
  var v = normalise($("addr").value);
  if (v) probe(v);
});
$("addr").addEventListener("input", function () { clearTimeout(retry); $("hint").textContent = t.hint; });
if (server) probe(server); else $("addr").focus();
</script>
</body>
</html>
