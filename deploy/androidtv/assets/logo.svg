<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- movies-cast logo: a TV whose screen is a film frame. Colours from tv.css: background and accent. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d2232"/>
      <stop offset="1" stop-color="#0b0d12"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fb923c" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#fb923c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="warm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fdba74"/>
      <stop offset="0.55" stop-color="#fb923c"/>
      <stop offset="1" stop-color="#ea580c"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <ellipse cx="256" cy="262" rx="230" ry="190" fill="url(#glow)"/>
  <!-- screen = film frame -->
  <rect x="72" y="118" width="368" height="248" rx="38" fill="url(#warm)"/>
  <g fill="#0f121a" fill-opacity="0.82">
    <rect x="104" y="136" width="30" height="20" rx="6"/><rect x="156" y="136" width="30" height="20" rx="6"/>
    <rect x="208" y="136" width="30" height="20" rx="6"/><rect x="260" y="136" width="30" height="20" rx="6"/>
    <rect x="312" y="136" width="30" height="20" rx="6"/><rect x="364" y="136" width="30" height="20" rx="6"/>
    <rect x="104" y="328" width="30" height="20" rx="6"/><rect x="156" y="328" width="30" height="20" rx="6"/>
    <rect x="208" y="328" width="30" height="20" rx="6"/><rect x="260" y="328" width="30" height="20" rx="6"/>
    <rect x="312" y="328" width="30" height="20" rx="6"/><rect x="364" y="328" width="30" height="20" rx="6"/>
  </g>
  <!-- play -->
  <path d="M228 200 L228 284 L302 242 Z" fill="#0f121a" stroke="#0f121a" stroke-width="20" stroke-linejoin="round"/>
  <!-- stand -->
  <rect x="240" y="366" width="32" height="30" fill="#c2410c"/>
  <rect x="176" y="392" width="160" height="22" rx="11" fill="url(#warm)"/>
</svg>
