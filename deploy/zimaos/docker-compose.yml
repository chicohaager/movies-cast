name: movies-cast
services:
  movies-cast:
    image: 127.0.0.1:5000/movies-cast:local
    container_name: movies-cast
    restart: unless-stopped
    # Host network: SSDP multicast must reach the TVs, and the TV must reach
    # this server on the NAS's LAN address. Movies is behind the ZimaOS gateway
    # on port 80 of the same host.
    network_mode: host
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      - TZ=$TZ
      - LISTEN=:8097
      - MOVIES_URL=http://127.0.0.1/movies
      # TVs by address (<tv-ip>,<tv-ip>): SSDP finds their current URL (the LG
      # changes its port). A firewall must let SSDP answers in: ZimaOS ZFW
      # (default-deny INPUT) needs UDP SSDP_PORT (1901) allowed from the LAN.
      # A full description URL works too, without SSDP.
      - RENDERERS=
      # Sessions (with Movies tokens, 0600) survive restarts; without it every
      # update sends the TV back to pairing.
      - STATE_FILE=/state/sessions.json
    volumes:
      - type: bind
        source: /DATA/AppData/movies-cast/state
        target: /state
    labels:
      icon: data:image/svg+xml;base64,
    x-casaos:
      volumes:
        - container: /state
          description:
            en_us: Login sessions of phones and the TV app (contains Movies tokens)
            de_de: Anmeldungen von Handys und der TV-App (enthält Movies-Tokens)
      envs:
        - container: RENDERERS
          description:
            en_us: Comma-separated TV addresses (IP, URL found by SSDP) or DLNA description URLs; allow UDP 1901 from the LAN in the firewall
            de_de: Kommagetrennte Fernseher-Adressen (IP, die URL findet SSDP) oder DLNA-Beschreibungs-URLs; in der Firewall UDP 1901 aus dem LAN erlauben
        - container: MOVIES_URL
          description:
            en_us: Movies' Jellyfin-compatible API behind the ZimaOS gateway
            de_de: Jellyfin-kompatible Schnittstelle von Movies hinter dem ZimaOS-Gateway
x-casaos:
  architectures:
    - amd64
  main: movies-cast
  author: movies-cast
  developer: movies-cast
  category: Media
  title:
    en_us: Movies-Cast
    de_de: Movies-Cast
  tagline:
    en_us: Play IceWhale Movies on your DLNA TV, controlled from the phone
    de_de: IceWhale-Movies auf dem DLNA-Fernseher abspielen, vom Handy aus
  description:
    en_us: Lists the films of IceWhale Movies, finds DLNA TVs on the network and sends the original file to the TV, which plays it itself. Only if a TV stays silent is the sound converted, on request.
    de_de: Zeigt die Filme aus IceWhale Movies, findet DLNA-Fernseher im Netz und schickt die Originaldatei an den Fernseher, der sie selbst abspielt. Nur wenn ein Fernseher stumm bleibt, wird der Ton auf Wunsch umgewandelt.
  # The movies-cast logo (web/logo.svg) as a data: URI, kept equal by
  # TestComposeIconIsTheLogo: no CDN, no host address, no mixed content.
  icon: data:image/svg+xml;base64,
  index: /
  port_map: "8097"
  scheme: http
  hostname: ""
