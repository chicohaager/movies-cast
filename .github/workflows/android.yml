name: Android app

# What ./check.sh runs for the app (deploy/tools/check-android.sh): complete translations, unit tests,
# a debug and a release build, and the APK checks. The release APK is unsigned here: the key is not
# in the repository. A second job runs the screen tests (check-android.sh --device) in an emulator.

on:
  push:
    branches: [master]
    paths: ['android/**', 'deploy/tools/check-android.sh', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', 'deploy/tools/check-android.sh', '.github/workflows/android.yml']

permissions:
  contents: read

jobs:
  check:
    name: Tests, builds and APK checks
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Java
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-37.0" "build-tools;37.0.0" "ndk;26.1.10909125" "cmake;3.31.6"
      - name: Build FFmpeg (LGPL configuration, 4 ABIs)
        run: android/ffmpeg/build-ffmpeg.sh
      - name: check-android.sh
        run: deploy/tools/check-android.sh
      # The log names a failed test with the first line of its message; the reports hold the rest.
      - name: Upload the test reports (only when a step failed)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: movies-cast-android-test-reports
          retention-days: 14
          if-no-files-found: warn
          path: |
            android/core/build/reports/tests
            android/core/build/test-results
            android/app/build/reports/tests
            android/app/build/test-results
      - name: Upload the debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: movies-cast-android-debug
          retention-days: 14
          if-no-files-found: error
          path: android/app/build/outputs/apk/debug/app-debug.apk

  device:
    name: Screen tests in an emulator
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Java
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-37.0" "build-tools;37.0.0"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # Without FFmpeg: the module then builds without native code, and these tests play nothing.
      - name: check-android.sh --device
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          disable-animations: true
          script: deploy/tools/check-android.sh --device
