<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Movies</title>
<link rel="icon" href="../logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="tv.css">
</head>
<body>
<div id="msg" class="msg" hidden></div>

<section id="pair" class="screen" hidden>
  <img class="pair-logo" src="../logo.svg" alt="">
  <h1>Movies</h1>
  <p class="big">Fernseher koppeln</p>
  <div id="pair-code" class="code">––– –––</div>
  <ol class="steps">
    <li>Am Handy <b id="pair-url"></b> öffnen und anmelden</li>
    <li>„Fernseher-App koppeln“ wählen</li>
    <li>Diesen Code eingeben</li>
  </ol>
  <p id="pair-state" class="hint"></p>
</section>

<section id="lib" class="screen" hidden>
  <header class="bar"><h1><img class="logo" src="../logo.svg" alt="">Movies</h1><span id="lib-user" class="hint"></span></header>
  <div id="lib-scroll" class="lib-scroll">
    <div id="resume-wrap" hidden>
      <h2>Weiterschauen</h2>
      <div id="resume" class="grid"></div>
    </div>
    <h2 id="all-h">Alle Filme</h2>
    <div id="grid" class="grid"></div>
    <p id="lib-empty" class="hint" hidden>Keine Filme in Movies gefunden.</p>
  </div>
</section>

<section id="detail" class="screen" hidden>
  <div class="detail">
    <img id="d-poster" alt="">
    <div class="d-text">
      <h1 id="d-title"></h1>
      <p id="d-meta" class="hint"></p>
      <p id="d-overview" class="overview"></p>
      <div class="buttons">
        <button id="d-resume" class="btn focusable" hidden></button>
        <button id="d-start" class="btn focusable">Von vorn abspielen</button>
        <button id="d-back" class="btn ghost focusable">Zurück</button>
      </div>
    </div>
  </div>
</section>

<section id="player" class="screen player" hidden>
  <video id="video" preload="auto"></video>
  <div id="osd" class="osd">
    <div class="osd-top"><span id="o-state" class="badge"></span><strong id="o-title"></strong><span id="o-audio" class="hint"></span><span id="o-sub" class="hint"></span></div>
    <div class="track"><i id="o-fill"></i></div>
    <div class="times"><span id="o-pos">0:00:00</span><span class="hint">OK Pause · ◀ −10 s · ▶ +30 s · ▲ Ton · ▼ Untertitel · Zurück beendet</span><span id="o-dur">0:00:00</span></div>
  </div>
  <div id="spinner" class="spinner" hidden>lädt …</div>
</section>

<script src="tv.js"></script>
</body>
</html>
